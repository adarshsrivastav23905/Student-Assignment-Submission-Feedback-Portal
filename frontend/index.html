<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cloud-based student assignment submission and feedback platform with role-based authentication, cloud database, and object storage.">
    <meta name="theme-color" content="#f7f9fc">
    <meta property="og:title" content="Cloud Assignment Portal">
    <meta property="og:description" content="A polished academic workflow for assignments, submissions, and feedback.">
    <title>Cloud Assignment Portal — Student Submission & Feedback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ===== NAVIGATION BAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-brand" aria-label="Cloud Assignment Portal">
            <span class="nav-icon" aria-hidden="true">C</span>
            <span class="nav-title">Cloud Assignment Portal</span>
        </div>
        <div class="nav-links" id="navLinks">
            <!-- Populated dynamically based on auth state -->
        </div>
    </nav>

    <!-- ===== MAIN CONTENT AREA ===== -->
    <main class="main-content" id="app">
        <!-- Content rendered dynamically by JavaScript -->
        <div class="loading-spinner" id="initialLoader">
            <div class="spinner"></div>
            <p>Loading Cloud Portal...</p>
        </div>
    </main>

    <!-- ===== TOAST NOTIFICATIONS ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== MODAL OVERLAY ===== -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal" id="modalContent">
            <!-- Modal content inserted dynamically -->
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
